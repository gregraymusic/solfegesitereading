<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treble Clef Solfege Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap');
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #f0fdf4;
    }
    .font-heading {
      font-family: 'Fredoka One', cursive;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-emerald-100 shadow-sm sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500 text-white p-2 rounded-xl shadow">
          <i class="fa-solid fa-music text-xl"></i>
        </div>
        <div>
          <h1 class="font-heading text-xl text-emerald-800 leading-tight">Solfege Reader</h1>
          <p class="text-xs text-slate-500 font-semibold">Sight-Reading Trainer</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <div class="flex items-center bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
          <i class="fa-solid fa-fire text-amber-500 mr-2"></i>
          <span class="text-sm font-bold text-emerald-900" id="streak-count">Streak: 0</span>
        </div>
        <button id="open-settings" class="p-2.5 text-slate-600 hover:text-emerald-600 hover:bg-emerald-50 rounded-xl transition">
          <i class="fa-solid fa-gear text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Settings Drawer Overlay -->
  <div id="settings-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 hidden transition-opacity"></div>

  <!-- Settings Drawer -->
  <aside id="settings-drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-sm bg-white z-40 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-emerald-50/50">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-[#059669] fa-sliders text-emerald-600"></i>
        <h2 class="font-heading text-lg text-emerald-900">Game Settings</h2>
      </div>
      <button id="close-settings" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <div class="p-5 overflow-y-auto flex-1 space-y-6 custom-scrollbar">
      <!-- Notes per exercise -->
      <div>
        <label class="block font-bold text-slate-700 text-sm mb-2">Pitches per Exercise</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="count-btn py-2 px-3 rounded-xl border-2 font-bold text-sm transition border-emerald-500 bg-emerald-50 text-emerald-700" data-count="3">3 Notes</button>
          <button type="button" class="count-btn py-2 px-3 rounded-xl border-2 font-bold text-sm transition border-slate-200 text-slate-600 hover:border-slate-300" data-count="4">4 Notes</button>
        </div>
      </div>

      <!-- Key selection -->
      <div>
        <label class="block font-bold text-slate-700 text-sm mb-2">Active Key</label>
        <select id="key-mode-select" class="w-full bg-slate-50 border border-slate-200 font-semibold text-sm rounded-xl p-2.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="F">Key of F Major (1 Flat)</option>
          <option value="G">Key of G Major (1 Sharp)</option>
          <option value="MIXED">Mixed (Random F or G)</option>
        </select>
      </div>

      <!-- Pitch selections -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="font-bold text-slate-700 text-sm">Allowed Pitches</label>
          <div class="space-x-1">
            <button id="select-all-pitches" class="text-xs text-emerald-600 font-bold hover:underline">All</button>
            <span class="text-xs text-slate-300">•</span>
            <button id="select-basic-pitches" class="text-xs text-emerald-600 font-bold hover:underline">Do-Re-Mi-So</button>
          </div>
        </div>
        <div id="pitch-checkboxes" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-slate-100 bg-slate-50">
      <button id="apply-settings" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-200 transition">
        Save & Apply
      </button>
    </div>
  </aside>

  <!-- Main Game Content -->
  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 flex flex-col justify-center">
    
    <!-- Info Bar -->
    <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center space-x-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Current Key:</span>
        <span id="active-key-display" class="font-bold text-emerald-700 bg-emerald-100/70 px-3 py-0.5 rounded-full text-sm">
          Key of F Major
        </span>
      </div>
      <button id="play-key-tonic" class="text-xs font-bold text-slate-600 hover:text-emerald-600 flex items-center space-x-1 bg-slate-50 hover:bg-emerald-50 border border-slate-200 px-3 py-1.5 rounded-lg transition">
        <i class="fa-solid fa-volume-high"></i>
        <span>Play Key Tonic</span>
      </button>
    </div>

    <!-- Staff Container Card -->
    <div class="bg-white rounded-3xl p-4 sm:p-8 shadow-xl shadow-emerald-950/5 border border-emerald-100/80 mb-6 relative overflow-hidden">
      <div class="w-full overflow-x-auto flex justify-center py-2">
        <svg id="music-staff" width="560" height="220" viewBox="0 0 560 220" class="select-none max-w-full">
          <!-- Background staff rendered via JS -->
        </svg>
      </div>
    </div>

    <!-- Dropdown Answer Inputs -->
    <div id="answers-container" class="grid grid-cols-3 sm:grid-cols-4 gap-3 sm:gap-4 mb-6">
      <!-- Generated dynamically based on pitch count -->
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <button id="submit-btn" class="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-circle-check"></i>
        <span>Submit Answer</span>
      </button>
      <button id="next-btn" class="w-full sm:w-auto px-8 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-base rounded-2xl transition hidden flex items-center justify-center space-x-2">
        <span>Next Sight Reading</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- Feedback Message -->
    <div id="feedback" class="mt-4 text-center font-bold text-base min-h-[1.75rem]"></div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-emerald-100/60 bg-white">
    Solfege Pitch Sight-Reading Game • Interactive Music Practice
  </footer>

  <script>
    // Pitch Definitions & Exact Coordinates
    // Baseline Line positions on SVG canvas:
    // Line 5 (Top - F5): Y = 60
    // Line 4 (D5):        Y = 73
    // Line 3 (B4):        Y = 86
    // Line 2 (G4):        Y = 99
    // Line 1 (Bottom-E4): Y = 112
    // Step size between line and adjacent space = 6.5px

    const SOLFEGE_PITCHES = [
      { id: "low_so", name: "low so", fNote: "C4", gNote: "D4", fY: 138, gY: 125, fDegree: -4, gDegree: -4 },
      { id: "low_la", name: "low la", fNote: "D4", gNote: "E4", fY: 131.5, gY: 118.5, fDegree: -3, gDegree: -3 },
      { id: "low_ti", name: "low ti", fNote: "E4", gNote: "F#4", fY: 125, gY: 112, fDegree: -2, gDegree: -2 },
      { id: "do",     name: "do",     fNote: "F4", gNote: "G4", fY: 118.5, gY: 105.5, fDegree: 0,  gDegree: 0 },   // F: 1st Space (118.5) | G: 2nd Line (105.5)
      { id: "re",     name: "re",     fNote: "G4", gNote: "A4", fY: 105.5, gY: 92.5,  fDegree: 1,  gDegree: 1 },   // F: 2nd Line (105.5) | G: 2nd Space (92.5)
      { id: "mi",     name: "mi",     fNote: "A4", gNote: "B4", fY: 92.5,  gY: 79.5,  fDegree: 2,  gDegree: 2 },   // F: 2nd Space (92.5) | G: 3rd Line (79.5)
      { id: "fa",     name: "fa",     fNote: "Bb4",gNote: "C5", fY: 86,    gY: 73,    fDegree: 3,  gDegree: 3 },   // F: 3rd Line (86)    | G: 3rd Space (73)
      { id: "so",     name: "so",     fNote: "C5", gNote: "D5", fY: 79.5,  gY: 66.5,  fDegree: 4,  gDegree: 4 },   // F: 3rd Space (79.5) | G: 4th Line (66.5)
      { id: "la",     name: "la",     fNote: "D5", gNote: "E5", fY: 66.5,  gY: 53.5,  fDegree: 5,  gDegree: 5 },
      { id: "ti",     name: "ti",     fNote: "E5", gNote: "F#5", fY: 53.5,  gY: 47,    fDegree: 6,  gDegree: 6 },
      { id: "hi_do",  name: "high do",fNote: "F5", gNote: "G5", fY: 47,    gY: 40.5,  fDegree: 7,  gDegree: 7 },
      { id: "hi_re",  name: "high re",fNote: "G5", gNote: "A5", fY: 40.5,  gY: 34,    fDegree: 8,  gDegree: 8 },
      { id: "hi_mi",  name: "high mi",fNote: "A5", gNote: "B5", fY: 34,    gY: 27.5,  fDegree: 9,  gDegree: 9 },
      { id: "hi_fa",  name: "high fa",fNote: "Bb5",gNote: "C6", fY: 27.5,  gY: 21,    fDegree: 10, gDegree: 10 },
      { id: "hi_so",  name: "high so",fNote: "C6", gNote: "D6", fY: 21,    gY: 14.5,  fDegree: 11, gDegree: 11 },
      { id: "hi_la",  name: "high la",fNote: "D6", gNote: "E6", fY: 14.5,  gY: 8,     fDegree: 12, gDegree: 12 }
    ];

    const FREQUENCIES = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "G4": 392.00,
      "A4": 440.00, "Bb4": 466.16, "B4": 493.88, "C5": 523.25, "D5": 587.33, "E5": 659.25,
      "F5": 698.46, "F#5": 739.99, "G5": 783.99, "A5": 880.00, "Bb5": 932.33, "B5": 987.77,
      "C6": 1046.50, "D6": 1174.66, "E6": 1318.51
    };

    // State Variables
    let currentKey = "F"; 
    let pitchCount = 4;
    let activePitchIds = ["do", "re", "mi", "so"];
    let selectedKeyMode = "F";
    let currentSequence = [];
    let userAnswers = [];
    let streak = 0;

    // Audio Context
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration = 0.5) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {
        // Audio playback fallback
      }
    }

    // Initialize Page Controls
    document.addEventListener("DOMContentLoaded", () => {
      renderPitchSettingsCheckboxes();
      setupEventListeners();
      generateExercise();
    });

    function renderPitchSettingsCheckboxes() {
      const container = document.getElementById("pitch-checkboxes");
      container.innerHTML = "";
      
      SOLFEGE_PITCHES.forEach(p => {
        const checked = activePitchIds.includes(p.id) ? "checked" : "";
        const div = document.createElement("label");
        div.className = "flex items-center space-x-2 p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-xs font-semibold text-slate-700 select-none";
        div.innerHTML = `
          <input type="checkbox" value="${p.id}" ${checked} class="pitch-checkbox rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4">
          <span>${p.name}</span>
        `;
        container.appendChild(div);
      });
    }

    function setupEventListeners() {
      // Drawer toggles
      document.getElementById("open-settings").addEventListener("click", openSettingsDrawer);
      document.getElementById("close-settings").addEventListener("click", closeSettingsDrawer);
      document.getElementById("settings-overlay").addEventListener("click", closeSettingsDrawer);

      // Pitch count buttons
      document.querySelectorAll(".count-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          document.querySelectorAll(".count-btn").forEach(b => {
            b.classList.remove("border-emerald-500", "bg-emerald-50", "text-emerald-700");
            b.classList.add("border-slate-200", "text-slate-600");
          });
          e.currentTarget.classList.remove("border-slate-200", "text-slate-600");
          e.currentTarget.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-700");
          pitchCount = parseInt(e.currentTarget.getAttribute("data-count"));
        });
      });

      // Quick pitch selections
      document.getElementById("select-all-pitches").addEventListener("click", () => {
        document.querySelectorAll(".pitch-checkbox").forEach(cb => cb.checked = true);
      });
      
      document.getElementById("select-basic-pitches").addEventListener("click", () => {
        document.querySelectorAll(".pitch-checkbox").forEach(cb => {
          cb.checked = ["do", "re", "mi", "so"].includes(cb.value);
        });
      });

      // Apply settings
      document.getElementById("apply-settings").addEventListener("click", () => {
        const selectedCbs = Array.from(document.querySelectorAll(".pitch-checkbox:checked")).map(cb => cb.value);
        if (selectedCbs.length < 2) {
          alert("Please select at least 2 pitches!");
          return;
        }
        activePitchIds = selectedCbs;
        selectedKeyMode = document.getElementById("key-mode-select").value;
        closeSettingsDrawer();
        generateExercise();
      });

      // Game actions
      document.getElementById("submit-btn").addEventListener("click", checkAnswers);
      document.getElementById("next-btn").addEventListener("click", generateExercise);
      document.getElementById("play-key-tonic").addEventListener("click", () => {
        const tonicFreq = currentKey === "F" ? FREQUENCIES["F4"] : FREQUENCIES["G4"];
        playTone(tonicFreq, 0.8);
      });
    }

    function openSettingsDrawer() {
      document.getElementById("settings-overlay").classList.remove("hidden");
      document.getElementById("settings-drawer").classList.remove("translate-x-full");
    }

    function closeSettingsDrawer() {
      document.getElementById("settings-overlay").classList.add("hidden");
      document.getElementById("settings-drawer").classList.add("translate-x-full");
    }

    function generateExercise() {
      // Determine active Key
      if (selectedKeyMode === "MIXED") {
        currentKey = Math.random() < 0.5 ? "F" : "G";
      } else {
        currentKey = selectedKeyMode;
      }

      document.getElementById("active-key-display").textContent = `Key of ${currentKey} Major`;

      // Pick pitches from active settings
      const pool = SOLFEGE_PITCHES.filter(p => activePitchIds.includes(p.id));
      currentSequence = [];
      for (let i = 0; i < pitchCount; i++) {
        const randomPitch = pool[Math.floor(Math.random() * pool.length)];
        currentSequence.push(randomPitch);
      }

      // Reset state
      userAnswers = new Array(pitchCount).fill("");
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "mt-4 text-center font-bold text-base min-h-[1.75rem]";
      document.getElementById("submit-btn").classList.remove("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      renderStaff();
      renderAnswerDropdowns();
    }

    function renderStaff() {
      const svg = document.getElementById("music-staff");
      svg.innerHTML = "";

      // Render 5 Staff Lines
      const lineYPositions = [60, 73, 86, 99, 112];
      lineYPositions.forEach(y => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", "20");
        line.setAttribute("y1", y);
        line.setAttribute("x2", "540");
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "#475569");
        line.setAttribute("stroke-width", "2");
        svg.appendChild(line);
      });

      // Right end double bar line
      const bar1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      bar1.setAttribute("x1", "534"); bar1.setAttribute("y1", "60");
      bar1.setAttribute("x2", "534"); bar1.setAttribute("y2", "112");
      bar1.setAttribute("stroke", "#475569"); bar1.setAttribute("stroke-width", "2");
      svg.appendChild(bar1);

      const bar2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      bar2.setAttribute("x1", "540"); bar2.setAttribute("y1", "60");
      bar2.setAttribute("x2", "540"); bar2.setAttribute("y2", "112");
      bar2.setAttribute("stroke", "#475569"); bar2.setAttribute("stroke-width", "4");
      svg.appendChild(bar2);

      // Render Treble Clef Image
      const clefImg = document.createElementNS("http://www.w3.org/2000/svg", "image");
      clefImg.setAttribute("href", "https://cdn.pixabay.com/photo/2016/03/26/01/17/treble-clef-1279909_960_720.png");
      clefImg.setAttribute("x", "25");
      clefImg.setAttribute("y", "24");
      clefImg.setAttribute("height", "105");
      svg.appendChild(clefImg);

      // Key Signatures
      if (currentKey === "F") {
        // Bb4 flat on 3rd line (Y = 86)
        const flat = document.createElementNS("http://www.w3.org/2000/svg", "text");
        flat.setAttribute("x", "100");
        flat.setAttribute("y", "92");
        flat.setAttribute("font-family", "serif");
        flat.setAttribute("font-size", "28");
        flat.setAttribute("fill", "#0f172a");
        flat.textContent = "♭";
        svg.appendChild(flat);
      } else if (currentKey === "G") {
        // F#5 sharp on 5th line (Y = 60)
        const sharp = document.createElementNS("http://www.w3.org/2000/svg", "text");
        sharp.setAttribute("x", "100");
        sharp.setAttribute("y", "68");
        sharp.setAttribute("font-family", "serif");
        sharp.setAttribute("font-size", "24");
        sharp.setAttribute("fill", "#0f172a");
        sharp.textContent = "♯";
        svg.appendChild(sharp);
      }

      // Render Notes
      const startX = 170;
      const totalWidth = 330;
      const stepX = totalWidth / (pitchCount + 1);

      currentSequence.forEach((pitchObj, index) => {
        const noteX = startX + stepX * (index + 1);
        const noteY = currentKey === "F" ? pitchObj.fY : pitchObj.gY;

        // Ledger Lines
        // Top staff line = 60, Bottom staff line = 112
        if (noteY >= 125) { // Below staff
          for (let ly = 125; ly <= noteY; ly += 13) {
            const ledger = document.createElementNS("http://www.w3.org/2000/svg", "line");
            ledger.setAttribute("x1", noteX - 16);
            ledger.setAttribute("x2", noteX + 16);
            ledger.setAttribute("y1", ly);
            ledger.setAttribute("y2", ly);
            ledger.setAttribute("stroke", "#475569");
            ledger.setAttribute("stroke-width", "2");
            svg.appendChild(ledger);
          }
        } else if (noteY <= 47) { // Above staff
          for (let ly = 47; ly >= noteY; ly -= 13) {
            const ledger = document.createElementNS("http://www.w3.org/2000/svg", "line");
            ledger.setAttribute("x1", noteX - 16);
            ledger.setAttribute("x2", noteX + 16);
            ledger.setAttribute("y1", ly);
            ledger.setAttribute("y2", ly);
            ledger.setAttribute("stroke", "#475569");
            ledger.setAttribute("stroke-width", "2");
            svg.appendChild(ledger);
          }
        }

        // Note Head (Quarter Note)
        const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        ellipse.setAttribute("cx", noteX);
        ellipse.setAttribute("cy", noteY);
        ellipse.setAttribute("rx", "9.5");
        ellipse.setAttribute("ry", "7");
        ellipse.setAttribute("transform", `rotate(-20 ${noteX} ${noteY})`);
        ellipse.setAttribute("fill", "#0f172a");
        svg.appendChild(ellipse);

        // Note Stem
        const stem = document.createElementNS("http://www.w3.org/2000/svg", "line");
        if (noteY < 86) {
          // Stem pointing Down (left side)
          stem.setAttribute("x1", noteX - 8.5);
          stem.setAttribute("y1", noteY + 1);
          stem.setAttribute("x2", noteX - 8.5);
          stem.setAttribute("y2", noteY + 38);
        } else {
          // Stem pointing Up (right side)
          stem.setAttribute("x1", noteX + 8.5);
          stem.setAttribute("y1", noteY - 1);
          stem.setAttribute("x2", noteX + 8.5);
          stem.setAttribute("y2", noteY - 38);
        }
        stem.setAttribute("stroke", "#0f172a");
        stem.setAttribute("stroke-width", "2.5");
        svg.appendChild(stem);

        // Position Label Badge
        const badge = document.createElementNS("http://www.w3.org/2000/svg", "text");
        badge.setAttribute("x", noteX);
        badge.setAttribute("y", "195");
        badge.setAttribute("text-anchor", "middle");
        badge.setAttribute("font-weight", "bold");
        badge.setAttribute("font-size", "13");
        badge.setAttribute("fill", "#64748b");
        badge.textContent = `Note ${index + 1}`;
        svg.appendChild(badge);
      });
    }

    function renderAnswerDropdowns() {
      const container = document.getElementById("answers-container");
      container.innerHTML = "";

      // Active dropdown choices sorted naturally
      const optionsPool = SOLFEGE_PITCHES.filter(p => activePitchIds.includes(p.id));

      for (let i = 0; i < pitchCount; i++) {
        const card = document.createElement("div");
        card.className = "bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center";
        
        card.innerHTML = `
          <span class="text-xs font-bold text-slate-400 mb-2">Note ${i + 1}</span>
          <select data-index="${i}" class="solfege-select w-full text-center font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl py-2 px-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="">-- Choose --</option>
            ${optionsPool.map(p => `<option value="${p.id}">${p.name}</option>`).join("")}
          </select>
        `;
        container.appendChild(card);
      }

      // Play sound on selection change
      document.querySelectorAll(".solfege-select").forEach(select => {
        select.addEventListener("change", (e) => {
          const idx = parseInt(e.target.getAttribute("data-index"));
          const chosenId = e.target.value;
          userAnswers[idx] = chosenId;

          if (chosenId) {
            const pitchObj = SOLFEGE_PITCHES.find(p => p.id === chosenId);
            if (pitchObj) {
              const noteName = currentKey === "F" ? pitchObj.fNote : pitchObj.gNote;
              if (FREQUENCIES[noteName]) {
                playTone(FREQUENCIES[noteName], 0.4);
              }
            }
          }
        });
      });
    }

    function checkAnswers() {
      let allCorrect = true;
      let unanswered = false;

      for (let i = 0; i < pitchCount; i++) {
        if (!userAnswers[i]) {
          unanswered = true;
          break;
        }
      }

      if (unanswered) {
        const feedback = document.getElementById("feedback");
        feedback.textContent = "Please select a solfege answer for every note!";
        feedback.className = "mt-4 text-center font-bold text-base text-amber-600";
        return;
      }

      const dropdowns = document.querySelectorAll(".solfege-select");
      dropdowns.forEach((select, i) => {
        const targetId = currentSequence[i].id;
        const selectedVal = userAnswers[i];
        const parentCard = select.closest("div");

        if (selectedVal === targetId) {
          parentCard.classList.remove("border-slate-200", "border-red-300");
          parentCard.classList.add("border-emerald-400", "bg-emerald-50/50");
        } else {
          allCorrect = false;
          parentCard.classList.remove("border-slate-200", "border-emerald-400");
          parentCard.classList.add("border-red-300", "bg-red-50/50");
        }
      });

      const feedback = document.getElementById("feedback");
      if (allCorrect) {
        streak++;
        document.getElementById("streak-count").textContent = `Streak: ${streak}`;
        feedback.textContent = "🎉 Excellent! All notes are identified correctly!";
        feedback.className = "mt-4 text-center font-bold text-base text-emerald-600";
        
        // Play success sequence
        currentSequence.forEach((p, idx) => {
          setTimeout(() => {
            const noteName = currentKey === "F" ? p.fNote : p.gNote;
            playTone(FREQUENCIES[noteName], 0.35);
          }, idx * 250);
        });

        document.getElementById("submit-btn").classList.add("hidden");
        document.getElementById("next-btn").classList.remove("hidden");
      } else {
        streak = 0;
        document.getElementById("streak-count").textContent = `Streak: ${streak}`;
        feedback.textContent = "Some answers are incorrect. Review the highlighted boxes and try again!";
        feedback.className = "mt-4 text-center font-bold text-base text-rose-600";
      }
    }
  </script>
</body>
</html>
